# ---------------------------------------------------------------------------
# L2Rust settings
# ---------------------------------------------------------------------------
# The settings of features of L2Rust that the Java L2jMobius server does not have.
# Every feature gets its own [Section] (a section line is a comment for the reader).
# Every key is commented with its meaning, its allowed range and its default.
# A missing or invalid value gives the default and a warning, never a crash.
# Reload while the server runs with the GM command //reload l2r.

# ---------------------------------------------------------------------------
# Companions (D-61): virtual party members hired at a town gatekeeper
# ---------------------------------------------------------------------------

[Companions]

# Factor on the P. Atk. of companions. Range 0.0 to 10.0. Default: 1.0
CompanionPAtkMultiplier = 1.0

# Factor on the M. Atk. of companions. Range 0.0 to 10.0. Default: 1.0
CompanionMAtkMultiplier = 1.0

# Factor on the max HP of companions. Range 0.1 to 10.0. Default: 1.0
CompanionHpMultiplier = 1.0

# true: the companions show in the party window of their owner. false: they do not.
# Default: true
CompanionAutoJoinParty = true

# AGGRESSIVE: the companions attack what the owner targets.
# PASSIVE: only after the owner attacked it himself.
# Players switch with the commands .companion aggressive and .companion passive.
# Default: PASSIVE
CompanionCombatMode = PASSIVE

# Adena a companion costs for each level of its owner (a level 40 player pays 40 times this).
# Range 0 to 1000000 (0: free). Default: 5000
CompanionFeePerLevel = 5000

# The most companions a player may have at once. A party window holds nine, the owner and his
# party included: a hire that would not fit in it is refused. Range 1 to 8. Default: 3
CompanionMaxCount = 3

# ---------------------------------------------------------------------------
# Rift invasions (D-64): rifts open at random times in the zones of
# data/RiftInvasion.xml; waves of invaders, then a rift boss. Participants get
# rift shards and trade them at the Rissbeschwoerer in Giran (multisell
# data/multisell/90000001.xml). GM commands: //rift_start [zone], //rift_stop,
# //rift_status, //rift_cap_reset [player].
# ---------------------------------------------------------------------------

[RiftInvasion]

# true: rifts open by themselves and the Rissbeschwoerer stands in Giran. false: no rifts, no
# merchant (a running rift closes; shards for its beaten waves are given). Default: true
RiftEnabled = true

# The next rift opens at a random time between these minutes after the last one ended.
# Range 1 to 10080 each (the maximum is never below the minimum). Default: 120 and 240
RiftIntervalMinMinutes = 120
RiftIntervalMaxMinutes = 240

# Minutes between the announcement (zone and time) and the opening. Range 0 to 60. Default: 5
RiftAnnounceLeadMinutes = 5

# true: a reminder one minute before the opening (when the lead is longer). Default: true
RiftAnnounceReminder = true

# Waves before the boss. Range 1 to 10. Default: 3
RiftWaveCount = 3

# Seconds after which the next wave comes even when the last one still stands (a beaten wave
# brings the next one at once). Range 10 to 3600. Default: 90
RiftWaveIntervalSeconds = 90

# Minutes a rift stays open; then it fails (shards for the beaten waves are still given).
# Range 1 to 240. Default: 20
RiftDurationMinutes = 20

# Added to the level of the rift monsters (the zone's level range of data/RiftInvasion.xml).
# Range -20 to 20. Default: 0
RiftMobLevelOffset = 0

# true: every player near the rift beyond the first adds RiftScalePerPlayerPercent to the
# monsters of a wave and to their HP (and to the boss's HP), at most RiftScaleMaxPercent.
# Default: true, 8 (range 0 to 100), 200 (range 0 to 1000)
RiftScaleWithPlayers = true
RiftScalePerPlayerPercent = 8
RiftScaleMaxPercent = 200

# Players within this range of the rift take part (presence, heals, the screen messages).
# Range 100 to 10000. Default: 3000
RiftParticipationRadius = 3000

# The share of a wave's (or the boss's) contribution a character needs for its shards:
# damage to the rift monsters, heals of participants and (a little) presence count.
# Anti-AFK. Range 0 to 100 (decimals allowed). Default: 1
RiftMinContributionPercent = 1

# The rift shard item. 0 = not set: the rift invasions stay off with a warning.
# 4405 = Blue Dimensional Stone - Shard (unused in High Five). Default in code: 0
RiftShardItemId = 4405

# Shards for each beaten wave, for the boss, and the bonus of the three best participants of a
# rift whose boss died. Range 0 to 10000 each. Default: 5, 15, 5
RiftShardsPerWave = 5
RiftShardsBoss = 15
RiftTopContributorBonus = 5

# true: the shards cannot be traded, dropped, sold in a private store, mailed, sent by freight
# or put into the clan warehouse (the own warehouse takes them). Default: true
RiftShardBound = true

# Shards a character can get per week. 0 = no limit. Range 0 to 1000000. Default: 400
RiftWeeklyCap = 400

# The weekly count starts again on this day (1 = Monday ... 7 = Sunday) at this hour (0 to 23),
# server time. Default: 3 (Wednesday), 6
RiftWeeklyResetDay = 3
RiftWeeklyResetHour = 6

# false: the rift monsters (and the boss) drop nothing and cannot be swept. Default: false
RiftMobsNormalDrops = false

# Factors on the exp and SP of the rift monsters. Range 0.0 to 100.0. Default: 1.0
RiftMobsExpRate = 1.0
RiftMobsSpRate = 1.0

# The Rissbeschwoerer: NPC id (0 = not set: the rift invasions stay off with a warning;
# 50030 is the shipped one, a changed id needs a restart) and where it stands (x,y,z).
# Default in code: 0 and 83400,148000,-3400 (Giran)
RiftMerchantNpcId = 50030
RiftMerchantLoc = 83400,148000,-3400
