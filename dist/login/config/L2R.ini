# ---------------------------------------------------------------------------
# L2Rust settings of the login server
# ---------------------------------------------------------------------------
# The settings of features of L2Rust that the Java L2jMobius server does not have (D-62).
# Every key is commented with its meaning, its allowed values and its default.
# A missing or invalid value gives the default and a warning, never a crash.
# Changes need a restart of the login server.

# ---------------------------------------------------------------------------
# Server list
# ---------------------------------------------------------------------------

[LoginServer]

# True: the server list in the client shows every registered game server, the ones that are
# down too (as in L2jMobius). False: only the game servers that are up; a server that is down
# (stopped, restarting, or an old registration that never connects) is not shown.
# Default: True
ShowDownServers = False
