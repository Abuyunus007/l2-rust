name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reference material must not be committed
        run: |
          bad=$(git ls-files | grep -E '^(l2jmobius|geodata-download|geodata-converted)/|\.l2j$|\.local\.ini$|(^|/)\.env$' || true)
          if [ -n "$bad" ]; then echo "Forbidden files committed:"; echo "$bad"; exit 1; fi
      - name: Line endings are LF
        run: |
          crlf=$(git ls-files --eol | awk '$1 ~ /crlf/ {print $NF}' | grep -vE '\.(bat|cmd|ps1)$' || true)
          if [ -n "$crlf" ]; then echo "Files with CRLF in the index:"; echo "$crlf"; exit 1; fi
