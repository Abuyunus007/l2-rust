name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Generated code is current (skipped without the Java source)
        run: cargo run -p codegen -- all --check

  # Integration tests that need a real database. GitHub service containers only exist on Linux
  # runners, so this is its own job; the Windows job above skips those tests (no
  # L2_TEST_DATABASE_URL). The database is a throwaway container, never a real one.
  database:
    name: Database integration (ubuntu-latest, MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      L2_TEST_DATABASE_URL: mysql://root@127.0.0.1:3306/
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Database tests of l2-db, login-server and game-server (unit + integration)
        run: cargo test -p l2-db -p login-server -p game-server -- --nocapture

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reference material must not be committed
        run: |
          bad=$(git ls-files | grep -E '^(l2jmobius|geodata-download|geodata-converted)/|\.l2j$|\.local\.ini$|(^|/)\.env$' || true)
          if [ -n "$bad" ]; then echo "Forbidden files committed:"; echo "$bad"; exit 1; fi
      - name: Line endings are LF
        run: |
          crlf=$(git ls-files --eol | awk '$1 ~ /crlf/ {print $NF}' | grep -vE '\.(bat|cmd|ps1)$' || true)
          if [ -n "$crlf" ]; then echo "Files with CRLF in the index:"; echo "$crlf"; exit 1; fi
