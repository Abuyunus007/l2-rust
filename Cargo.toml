[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Abuyunus007/l2-rust"

# Approved dependencies (D-28). Member crates use `name.workspace = true`.
# Adding a crate here needs the orchestrator's approval.
[workspace.dependencies]
# Internal crates
l2-util = { path = "crates/l2-util" }
l2-testkit = { path = "crates/l2-testkit" }
l2-net = { path = "crates/l2-net" }
l2-crypto = { path = "crates/l2-crypto" }
l2-config = { path = "crates/l2-config" }
l2-data = { path = "crates/l2-data" }
l2-admin-api = { path = "crates/l2-admin-api" }
l2-protocol-game = { path = "crates/l2-protocol-game" }
l2-geo = { path = "crates/l2-geo" }
l2-db = { path = "crates/l2-db" }
l2-world = { path = "crates/l2-world" }
l2-scripts = { path = "crates/l2-scripts" }
l2-protocol-login = { path = "crates/l2-protocol-login" }
l2-proxy = { path = "crates/l2-proxy" }

# Async, networking
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.12"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.30"

# Errors, logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Serialization, data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
quick-xml = { version = "0.42", features = ["serialize"] }
hex = "0.4"
base64 = "0.23"
regex = "1.11" # Java regex templates in Server.ini (CnameTemplate etc.), D-28

# Randomness, crypto
rand = "0.10"
rand_chacha = "0.10"
blowfish = "0.10"
cipher = "0.5"
rsa = "0.9"
num-bigint-dig = "0.8" # the version rsa 0.9 uses; keep them in sync
sha1 = "0.11"
subtle = "2.6"

# Database
sqlx = { version = "0.9", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls", "macros"] }

# Concurrency helpers (server processes only, never game state: D-10)
dashmap = "6"

# GUI, tools
eframe = "0.37"
egui = "0.37"
png = "0.18"
clap = { version = "4.6", features = ["derive"] }

# Code generation
prettyplease = "0.3"
syn = { version = "3.0", features = ["full"] }
quote = "1.0"

# Dev only
proptest = "1.12"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
# Line numbers in panics and backtraces are enough here. Full debug info made every build folder
# (one per worktree) 10-20 GB on the owner's disk.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies (crypto, RSA keygen) are slow unoptimized; our own crates stay debuggable.
opt-level = 2
debug = false
