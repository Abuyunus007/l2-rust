# Database backups of the supervisor (M9-H01). Rust-only (D-36), next to supervisor.ini.
# Same syntax as the Java .ini files. Relative paths are relative to this file's folder.
# A backup is `mysqldump --single-transaction --routines --events <db>`, written gzip-compressed
# to <Folder>/<db>-YYYYMMDD-HHMMSS.sql.gz. The password goes to mysqldump through the MYSQL_PWD
# environment variable and is never logged.

# The schedule. "Backup now" in the admin GUI works either way.
Enabled = False

# Hours between two scheduled backups.
IntervalHours = 24

# How many backup files stay; older ones are deleted after each backup.
Keep = 7

# Where the files go.
Folder = backups

# The mysqldump executable, or the folder holding it. Empty = look on the PATH, then in the
# MySqlBinLocation of Database.ini, then in the usual MariaDB/MySQL/XAMPP folders on Windows.
MysqldumpPath =

# Host, port, user, password and database name are read from here, every time a backup starts.
DatabaseIni = ../login/config/Database.ini
