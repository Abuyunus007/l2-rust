# Supervisor settings (D-36). Copy to supervisor.ini and adjust.
# Same syntax as the Java .ini files. Relative paths are relative to this file's folder.

# Where the admin GUI connects. Keep it on localhost unless you tunnel it (SSH / TLS proxy).
Listen = 127.0.0.1:7900

# Shared secret for the GUI. Empty = the supervisor refuses every connection.
Token =

# Lines kept per server for the log backlog.
LogBufferLines = 10000

# Seconds a process gets to exit after the stop signal before it is killed.
StopTimeoutSecs = 30

# Seconds to wait before starting a server again after it exited with its restart code
# (Java: LoginServerTask.sh / GameServer.sh sleep 10).
RestartDelaySecs = 10

# Servers, in display order. Every name needs Server.<name>.* keys.
Servers = login, game

# ---- Rust login server -------------------------------------------------------------------
# Command: a bare name is looked up on the PATH, a path with slashes is relative to this folder.
# Args: split on spaces, "double quotes" keep a space inside one argument.
# WorkingDir: the server's own folder (it reads config/ from there).
# AdminEndpoint / AdminToken: Bind / Token of the server's config/Admin.ini, used to relay status.
# Autostart: start together with the supervisor.
# RestartOnExitCode: exit code that means "restart me" (Java servers use 2). Empty = never.
Server.login.Command = ../../target/release/login-server
Server.login.Args =
Server.login.WorkingDir = ../../dist/login
Server.login.AdminEndpoint = 127.0.0.1:7901
Server.login.AdminToken =
Server.login.Autostart = True
Server.login.RestartOnExitCode = 2

# ---- Java game server (until the Rust one replaces it) -----------------------------------
# Same command line as GameServer.sh / GameServer.vbs: the java options come from java.cfg.
# Needs `java` on the PATH (or give the full path to java in Command).
Server.game.Command = java
Server.game.Args = @java.cfg -jar ../libs/GameServer.jar
Server.game.WorkingDir = ../../dist/game
Server.game.Autostart = False
Server.game.RestartOnExitCode = 2
