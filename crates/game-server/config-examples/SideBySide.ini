# Rust-only side-by-side settings (D-36, D-39). Copy to config/SideBySide.ini in the game server's
# config folder. The Java .ini files are never extended; a missing file means the defaults below.
# Same syntax as the Java .ini files.

# The daily reset (06:30 local time) runs two UPDATEs over EVERY row of character_reco_bonus
# (Java DailyResetManager.resetRecommends: rec_left = 20, time_left = 1 hour, rec_have - 20).
# While the Java game server runs on the same database it runs them itself, and running them twice
# would take 40 recommendations away. So by default this server leaves them to Java and only
# resets the characters that are online here (in memory, packets, and their own rows through the
# normal store).
# Set True only when this server is the only one on the database.
# Default: False
DailyResetDatabaseWrites = False

# The clan jobs that write rows on their own (Java ClanTable and DailyResetManager): the
# dissolution of a clan whose waiting time ran out (deletes the clan rows and takes every member
# out of it), the Wednesday change of the clan leaders asked at a village master, the start-up
# check that drops alliances whose leading clan is gone, and the shutdown save of every clan.
# While the Java game server runs on the same database it does them itself; by default this server
# only changes its own memory and its online players, and at shutdown saves only the clans it
# changed. Set True only when this server is the only one on the database.
# Default: False
ClanMaintenanceDatabaseWrites = False

# The expiry of mails (Java MessageDeletionTaskManager, every 10 seconds): a mail whose 15 days
# (12 hours for a payment request) ran out is deleted from the messages table and its attachments
# go back to the sender. While the Java game server runs on the same database it does this on its
# own schedule; by default this server expires the mails in its memory only and writes no row.
# Set True only when this server is the only one on the database.
# Default: False
MailExpiryDatabaseWrites = False

# The sieges and the residences (D-51): the Java game server runs the real castle, fortress, clan
# hall and Territory War sieges while both servers share the database. By default this server
# writes no siege-like result: a GM test siege works in this world, but the owner changes, the
# siege registrations and state, the castle tax income (the treasury) and the fees the clan
# warehouses pay for residence functions stay in its memory, and the residences of a clan are
# read again when one of its characters logs in. What a player does himself (a function bought,
# a tax rate set at the chamberlain) is written as usual.
# Set True only when this server is the only one on the database.
# Default: False
SiegeDatabaseWrites = False
